name: generate snake animation

on:
  schedule:
    - cron: "0 */24 * * *"   # regenerates once a day
  workflow_dispatch:          # lets you trigger it manually too
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # One snake, one implementation. Platane/snk is gone -- it's a
      # closed third-party action with no way to target a specific year
      # (it only ever reads whatever GitHub's live rolling contribution
      # graph currently says), so it structurally couldn't be combined
      # with the year-cycling logic below. Rather than run two separate
      # snakes with two different looks, this uses the custom
      # pathfinding engine (profile/build-snake.js) for everything --
      # its palette already matches GitHub's real dark-mode contribution
      # colors exactly (verified: --c0 through --c4 are the literal
      # github-dark hex values), so the visual result is consistent with
      # what Platane/snk used to produce, just from one script instead
      # of two.
      #
      # Cycles deterministically through every year since the account
      # was created, changing once per day, no state file needed -- see
      # the day-count math below.
      - name: Generate the snake SVG
        id: snake
        uses: actions/github-script@v7
        env:
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { buildSnakeSVG } = require('./profile/build-snake.js');

            const username = "A-Theme";

            // SNAKE_TOKEN is a personal access token, so it expires. When it
            // does, GraphQL answers 401 "Bad credentials" on the very first
            // query and the whole job dies -- which is what froze the snake on
            // the profile at its 7 Sep render while every run since reported
            // failure. So each query is attempted with the PAT and then
            // retried with the automatic GITHUB_TOKEN, which needs no
            // maintenance and can read public contribution counts. A dead PAT
            // now costs the private-contribution portion of the graph rather
            // than the graph itself, and says so in the run summary.
            const candidates = [
              ['SNAKE_TOKEN', process.env.SNAKE_TOKEN],
              ['GITHUB_TOKEN', process.env.FALLBACK_TOKEN],
            ].filter(([, token]) => token);

            if (!candidates.length) {
              throw new Error('no token available: neither SNAKE_TOKEN nor GITHUB_TOKEN is set');
            }

            let working = null;

            async function gql(query, variables) {
              let lastError = 'no attempt made';
              for (const candidate of working ? [working] : candidates) {
                const [name, token] = candidate;
                const res = await fetch('https://api.github.com/graphql', {
                  method: 'POST',
                  headers: {
                    authorization: `bearer ${token}`,
                    'content-type': 'application/json',
                    'user-agent': 'A-Theme-snake',
                  },
                  body: JSON.stringify({ query, variables }),
                });
                const body = await res.json().catch(() => ({}));
                if (res.ok && body.data && !body.errors) {
                  if (!working) {
                    working = candidate;
                    if (name !== candidates[0][0]) {
                      core.warning(
                        `${candidates[0][0]} was rejected -- falling back to ${name}. ` +
                        'The snake still builds, but private contributions are not ' +
                        'counted until the PAT is renewed in repo settings > secrets.'
                      );
                    }
                  }
                  return body.data;
                }
                lastError = `${name}: HTTP ${res.status} ` +
                  JSON.stringify(body.errors || body.message || body);
                core.warning(`GraphQL rejected ${lastError}`);
              }
              throw new Error(`every available token failed -- last was ${lastError}`);
            }

            const createdRes = await gql(
              `query($login: String!) { user(login: $login) { createdAt } }`,
              { login: username }
            );
            const createdYear = new Date(createdRes.user.createdAt).getFullYear();
            const currentYear = new Date().getFullYear();

            const yearsAvailable = [];
            for (let y = createdYear; y <= currentYear; y++) yearsAvailable.push(y);

            // Deterministic daily rotation -- no state file to maintain,
            // just changes automatically once every 24h and wraps around.
            // Years the account was registered for but never committed in are
            // skipped: the rotation used to publish them anyway, and the first
            // green run after the token fix deployed a completely empty grid
            // labelled "2022 - 0 contributions" over a good render. An empty
            // year is a worse profile image than a repeated one, so the
            // rotation starts at the deterministic index and walks forward to
            // the first year that actually has contributions.
            const CALENDAR = `query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $to) {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        contributionLevel
                        weekday
                        date
                      }
                    }
                  }
                }
              }
            }`;

            const daysSinceEpoch = Math.floor(Date.now() / 86400000);
            const startIndex = daysSinceEpoch % yearsAvailable.length;

            let targetYear = null;
            let weeks = null;
            const emptyYears = [];

            for (let step = 0; step < yearsAvailable.length; step++) {
              const year = yearsAvailable[(startIndex + step) % yearsAvailable.length];
              const from = new Date(Date.UTC(year, 0, 1)).toISOString();
              const to = new Date(Date.UTC(year, 11, 31, 23, 59, 59)).toISOString();
              const res = await gql(CALENDAR, { login: username, from, to });
              const calendar = res.user.contributionsCollection.contributionCalendar;
              if (calendar.totalContributions > 0) {
                targetYear = year;
                weeks = calendar.weeks;
                break;
              }
              emptyYears.push(year);
            }

            if (emptyYears.length) {
              core.warning(
                `no contributions in ${emptyYears.join(', ')} -- skipped, ` +
                `rotation moved on to ${targetYear ?? 'nothing'}`
              );
            }

            // Failing here is deliberate. The deploy step force-pushes an
            // orphan commit over the output branch, so writing a blank SVG
            // would destroy the last good one with no way back; stopping
            // instead leaves the previous render serving on the profile.
            if (!targetYear) {
              throw new Error(
                `every year from ${yearsAvailable[0]} to ` +
                `${yearsAvailable[yearsAvailable.length - 1]} came back with zero ` +
                'contributions -- refusing to overwrite the output branch with an ' +
                'empty snake. The token in use likely cannot read contribution data.'
              );
            }

            const { svg, totalContribs } = buildSnakeSVG(weeks, targetYear);

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/snake.svg', svg);
            core.summary
              .addRaw(`Built snake for **${targetYear}**: ${totalContribs} contributions ` +
                      `(token: ${working[0]})`)
              .write();
            console.log(`Built snake for ${targetYear}: ${totalContribs} contributions`);

      - name: Push the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
