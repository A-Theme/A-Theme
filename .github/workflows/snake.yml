name: generate snake animation

on:
  schedule:
    - cron: "0 */.25 * * *"   # regenerates once a day
  workflow_dispatch:          # lets you trigger it manually too
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # One snake, one implementation. Platane/snk is gone -- it's a
      # closed third-party action with no way to target a specific year
      # (it only ever reads whatever GitHub's live rolling contribution
      # graph currently says), so it structurally couldn't be combined
      # with the year-cycling logic below. Rather than run two separate
      # snakes with two different looks, this uses the custom
      # pathfinding engine (profile/build-snake.js) for everything --
      # its palette already matches GitHub's real dark-mode contribution
      # colors exactly (verified: --c0 through --c4 are the literal
      # github-dark hex values), so the visual result is consistent with
      # what Platane/snk used to produce, just from one script instead
      # of two.
      #
      # Cycles deterministically through every year since the account
      # was created, changing once per day, no state file needed -- see
      # the day-count math below.
      - name: Generate the snake SVG
        id: snake
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SNAKE_TOKEN }}
          script: |
            const fs = require('fs');
            const { buildSnakeSVG } = require('./profile/build-snake.js');

            const username = "A-Theme";

            const createdRes = await github.graphql(
              `query($login: String!) { user(login: $login) { createdAt } }`,
              { login: username }
            );
            const createdYear = new Date(createdRes.user.createdAt).getFullYear();
            const currentYear = new Date().getFullYear();

            const yearsAvailable = [];
            for (let y = createdYear; y <= currentYear; y++) yearsAvailable.push(y);

            // Deterministic daily rotation -- no state file to maintain,
            // just changes automatically once every 24h and wraps around.
            const daysSinceEpoch = Math.floor(Date.now() / 86400000);
            const targetYear = yearsAvailable[daysSinceEpoch % yearsAvailable.length];

            const from = new Date(Date.UTC(targetYear, 0, 1)).toISOString();
            const to = new Date(Date.UTC(targetYear, 11, 31, 23, 59, 59)).toISOString();

            const dataRes = await github.graphql(
              `query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      weeks {
                        contributionDays {
                          contributionCount
                          contributionLevel
                          weekday
                          date
                        }
                      }
                    }
                  }
                }
              }`,
              { login: username, from, to }
            );

            const weeks = dataRes.user.contributionsCollection.contributionCalendar.weeks;
            const { svg, totalContribs } = buildSnakeSVG(weeks, targetYear);

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/snake.svg', svg);
            console.log(`Built snake for ${targetYear}: ${totalContribs} contributions`);

      - name: Push the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
