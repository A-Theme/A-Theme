name: update readme stats cards

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate main stats card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: stats
          options: "username=Aramaki&show_icons=true&theme=radical&hide_border=true&bg_color=0b1420&title_color=00c2ff&icon_color=ff3c50&text_color=eaf1fa"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: top-langs
          options: "username=Aramaki&layout=compact&theme=radical&hide_border=true&bg_color=0b1420&title_color=00c2ff&text_color=eaf1fa"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Theme-App pin
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Theme-App&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-theme-app.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Switch-Theme-Installer pin
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Switch-Theme-Installer&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-switch-installer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Tinfoil-Themes pin
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Tinfoil-Themes&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-tinfoil-themes.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update stats cards [skip ci]"
          git push
