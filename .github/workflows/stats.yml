name: update readme stats cards

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # continue-on-error on every generation step below: if any ONE card
      # fails (a flaky third-party action, a rate limit, whatever), the
      # others still generate and the commit step still runs at the end.
      # One broken card should never block the other four again.

      - name: Generate main stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: stats
          options: "username=A-Theme&show_icons=true&include_all_commits=true&theme=radical&hide_border=true&bg_color=0b1420&title_color=00c2ff&icon_color=ff3c50&text_color=eaf1fa"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: top-langs
          options: "username=A-Theme&layout=compact&theme=radical&hide_border=true&bg_color=0b1420&title_color=00c2ff&text_color=eaf1fa"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Theme-App pin
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Theme-App&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-theme-app.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Switch-Theme-Installer pin
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Switch-Theme-Installer&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-switch-installer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Tinfoil-Themes pin
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: pin
          options: "username=A-Theme&repo=Tinfoil-Themes&theme=radical&hide_border=true&bg_color=0b1420"
          path: profile/pin-tinfoil-themes.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Trophy: the self-hosted generator action (Erik-Donath's unmerged
      # feature/generate-svg branch) has now failed twice for two
      # different reasons, and it's an unreleased branch with no version
      # tag to pin to -- not stable enough to depend on. Falling back to
      # the plain hosted image in the README is the more honest tradeoff
      # here: it's not immune to the shared-instance flakiness we fixed
      # everything else for, but it's not actively broken either, and it
      # stops eating a workflow run every time it fails. Revisit if a
      # stable release tag ever lands.

      # Lifetime contribution total -- GitHub's API caps a single query
      # at ~1 year, so this sums one query per calendar year since the
      # account was created rather than trying to ask for "all of it" at
      # once (which the API structurally can't answer in one call).
      - name: Calculate lifetime contribution total
        id: lifetime
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SNAKE_TOKEN }}
          script: |
            const username = "A-Theme";

            const createdRes = await github.graphql(
              `query($login: String!) { user(login: $login) { createdAt } }`,
              { login: username }
            );
            const createdAt = new Date(createdRes.user.createdAt);
            const now = new Date();

            let total = 0;
            for (let year = createdAt.getFullYear(); year <= now.getFullYear(); year++) {
              const from = new Date(Date.UTC(year, 0, 1)).toISOString();
              const to = new Date(Date.UTC(year, 11, 31, 23, 59, 59)).toISOString();
              const res = await github.graphql(
                `query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      contributionCalendar { totalContributions }
                    }
                  }
                }`,
                { login: username, from, to }
              );
              total += res.user.contributionsCollection.contributionCalendar.totalContributions;
            }

            core.setOutput('total', total);
            console.log(`Lifetime total for ${username}: ${total}`);

      - name: Generate lifetime total badge
        if: steps.lifetime.outcome == 'success'
        run: |
          mkdir -p profile
          TOTAL="${{ steps.lifetime.outputs.total }}"
          cat > profile/lifetime-badge.svg << SVGEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="50">
            <rect width="400" height="50" rx="12" fill="#0b1420" stroke="#00c2ff" stroke-width="1.5"/>
            <text x="200" y="32" font-family="monospace,'Fira Code'" font-size="18" fill="#00c2ff" text-anchor="middle">🐍 ${TOTAL} contributions and counting</text>
          </svg>
          SVGEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update stats cards [skip ci]"
          git push
