<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 1200 300" width="1200" height="300" role="img"
      aria-labelledby="heroTitle heroDesc">
      <title id="heroTitle">Aramaki</title>
      <desc id="heroDesc">Animated banner: the name ARAMAKI over a drifting starfield, with tags for native C Switch homebrew, JavaScript on the Switch via nx.js, on-device k-means palettes, and installable web apps.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#0e1c2e"/>
          <stop offset="0.55" stop-color="#0b1420"/>
          <stop offset="1" stop-color="#070e17"/>
        </linearGradient>

        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#00c2ff"/>
          <stop offset="0.3" stop-color="#9d4edd"/>
          <stop offset="0.62" stop-color="#ff3c50"/>
          <stop offset="1" stop-color="#00c2ff"/>
          <animateTransform attributeName="gradientTransform" type="translate"
            values="-0.55 0; 0.55 0; -0.55 0" dur="11s" repeatCount="indefinite"/>
        </linearGradient>

        <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#00c2ff" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#9d4edd" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#ff3c50" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.30"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#00c2ff" stop-opacity="0.30"/>
          <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
        </radialGradient>

        <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0H0V44" fill="none" stroke="#00c2ff" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>

        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>

        <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
      </defs>

      <style>
        .ltr {
          font: 800 92px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace;
          fill: url(#ink); letter-spacing: 2px;
          animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
        }
        .tag {
          font: 500 19px ui-monospace, 'Fira Code', Consolas, monospace; fill: #a8bdd4;
          animation: fade 1s ease-out 0.75s both;
        }
        .chip { animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both; }
        .chip-t { font: 500 12.5px ui-monospace, 'Fira Code', Consolas, monospace; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      </style>

      <g clip-path="url(#frame)">
        <rect width="1200" height="300" fill="url(#sky)"/>

        <!-- grid drifting up-left, one tile per cycle so the loop is seamless -->
        <g opacity="0.9">
          <rect x="-44" y="-44" width="1288" height="388" fill="url(#grid)">
            <animateTransform attributeName="transform" type="translate"
              values="0 0; -44 -44" dur="16s" repeatCount="indefinite"/>
          </rect>
        </g>

