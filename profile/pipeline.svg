<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 478"
  width="1200" height="478" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">How the A-Theme project fits together</title>
  <desc id="pipeDesc">A system map. Theme-App (browser, PWA and Windows desktop) exports themes into two databases. The active one is RomM-Themes (manifest.json, 134 themes, 19 colour roles, validated in CI), read on the console by the RomM Switch client, an SDL2 homebrew app. The older one is Tinfoil-Themes (themes.json, 173 entries, served from GitHub Pages), read by Switch-Theme-Installer, a C homebrew .nro. Both databases are browsable from inside the editors.</desc>
  <defs>
    <pattern id="gpipe" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00c2ff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <clipPath id="pipeframe"><rect width="1200" height="478" rx="14"/></clipPath>
  </defs>
  <style>
    .bt { font: 700 15px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; }
    .bs { font: 400 12.5px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #a8bdd4; }
    .bn { font: 400 11.5px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #7d95ae; }
    .wl { font: 400 11px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #7d95ae; }
    .lg { font: 400 11.5px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #7d95ae; }
    .tier { font: 700 11px ui-monospace, 'SFMono-Regular', 'Fira Code', Consolas, monospace; fill: #7d95ae; letter-spacing: 2px; }
  </style>
  <g clip-path="url(#pipeframe)">
    <rect width="1200" height="478" fill="#0b1420"/>
    <rect width="1200" height="478" fill="url(#gpipe)"/>
    <text class="tier" x="40" y="84">AUTHOR</text>
    <text class="tier" x="40" y="196">PUBLISH</text>
    <text class="tier" x="40" y="358">CONSOLE</text>
