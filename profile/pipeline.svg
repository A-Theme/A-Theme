peatCount="indefinite"/></circle><text class="wl" x="330" y="330">the same manifest the console reads</text><path id="w6" d="M890 288 L 890 372" fill="none" stroke="#00c2ff" stroke-opacity="0.38" stroke-width="1.6" stroke-dasharray="5 5"/><circle r="3.4" fill="#00c2ff"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#w6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#00c2ff"><animateMotion dur="2.6s" begin="1.30s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#w6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="1.30s" repeatCount="indefinite"/></circle><text class="wl" x="600" y="330">read live over the console's own network stack</text>
