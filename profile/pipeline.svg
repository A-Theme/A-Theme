le><text class="bt" x="18" y="27" fill="#5be27a">RomM Switch client</text><text class="bs" x="18" y="48">SDL2 homebrew  ·  reads a folder on the SD card</text></g><g transform="translate(700,372)"><rect width="380" height="62" rx="10" fill="#101c2c" stroke="#ff3c50" stroke-opacity="0.55"/><rect width="4" height="62" rx="2" fill="#ff3c50" opacity="0.85"/><circle cx="364" cy="16" r="4" fill="#ff3c50"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle><text class="bt" x="18" y="27" fill="#ff3c50">Switch-Theme-Installer</text><text class="bs" x="18" y="48">.nro  ·  C  ·  devkitA64 / libnx / SDL2</text></g><path id="w1" d="M540 118 C 440 160, 330 160, 310 210" fill="none" stroke="#5be27a" stroke-opacity="0.38" stroke-width="1.6" stroke-dasharray="5 5"/><circle r="3.4" fill="#5be27a"><animateMotion dur="3.2s" begin="0.00s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#w1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.2s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#5be27a"><animateMotion dur="3.2s" begin="1.07s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#w1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.2s" begin="1.07s" repeatCount="indefinite"/></circle><circle r="3.4" fill="#5be27a"><animateMotion dur="3.2s" begin="2.13s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#w1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.2s" begin="2.13s" repeatCount="indefinite"/></circle><text class="wl" x="300" y="202">exports a theme.json or a .zip pack</text><path id="w2" d="M660 118 C 760 